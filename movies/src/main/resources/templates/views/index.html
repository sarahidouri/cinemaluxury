<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINIMALUXURY Dashboard</title>
</head>

<body>

    <h1>CINIMALUXURY Dashboard</h1>

    <p>
        Welcome <span th:text="${username}">Admin</span>
    </p>

    <h2>Statistics</h2>

    <ul>
        <li>
            Films:
            <span th:text="${filmCount}">0</span>
        </li>

        <li>
            Salles:
            <span th:text="${salleCount}">0</span>
        </li>

        <li>
            Séances:
            <span th:text="${seanceCount}">0</span>
        </li>

        <li>
            Users:
            <span th:text="${userCount}">0</span>
        </li>
    </ul>

    <h2>API Links</h2>

    <ul>
        <li>
            <a th:href="@{/api/films}">Films</a>
        </li>

        <li>
            <a th:href="@{/api/genres}">Genres</a>
        </li>

        <li>
            <a th:href="@{/api/personnes}">Personnes</a>
        </li>

        <li>
            <a th:href="@{/api/seances}">Séances</a>
        </li>
    </ul>

</body>

</html>
