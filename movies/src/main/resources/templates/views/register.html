<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CINIMALUXURY - Inscription</title>

    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">

    <link th:href="@{/css/font-awesome.css}" rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center"
         style="min-height: 100vh;">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow">

                <!-- HEADER -->

                <div class="card-header bg-primary text-white text-center">

                    <h4 class="mb-0">

                        <i class="fa fa-film"></i>

                        CINIMALUXURY

                    </h4>

                    <small>
                        Créer un compte
                    </small>

                </div>


                <!-- BODY -->

                <div class="card-body p-4">

                    <!-- Message succès -->

                    <div th:if="${success}"
                         class="alert alert-success"
                         th:text="${success}">
                    </div>


                    <!-- Message erreur -->

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>


                    <form th:action="@{/register}"
                          th:object="${userDTO}"
                          method="post">

                        <!-- Nom -->

                        <div class="mb-3">

                            <label for="nom"
                                   class="form-label">

                                Nom

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa fa-user"></i>

                                </span>

                                <input type="text"
                                       id="nom"
                                       th:field="*{nom}"
                                       class="form-control"
                                       placeholder="Votre nom"
                                       required>

                            </div>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('nom')}"
                                 th:errors="*{nom}">
                            </div>

                        </div>


                        <!-- Prénom -->

                        <div class="mb-3">

                            <label for="prenom"
                                   class="form-label">

                                Prénom

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa fa-user"></i>

                                </span>

                                <input type="text"
                                       id="prenom"
                                       th:field="*{prenom}"
                                       class="form-control"
                                       placeholder="Votre prénom"
                                       required>

                            </div>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('prenom')}"
                                 th:errors="*{prenom}">
                            </div>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">

                                Email

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa fa-envelope"></i>

                                </span>

                                <input type="email"
                                       id="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       placeholder="exemple@email.com"
                                       required>

                            </div>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>

                        </div>


                        <!-- Username -->

                        <div class="mb-3">

                            <label for="username"
                                   class="form-label">

                                Nom d'utilisateur

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa fa-user"></i>

                                </span>

                                <input type="text"
                                       id="username"
                                       th:field="*{username}"
                                       class="form-control"
                                       placeholder="Choisissez un username"
                                       required>

                            </div>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}">
                            </div>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label for="password"
                                   class="form-label">

                                Mot de passe

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa fa-lock"></i>

                                </span>

                                <input type="password"
                                       id="password"
                                       th:field="*{password}"
                                       class="form-control"
                                       placeholder="Votre mot de passe"
                                       required>

                            </div>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('password')}"
                                 th:errors="*{password}">
                            </div>

                        </div>


                        <!-- Confirmation -->

                        <div class="mb-3">

                            <label for="confirmPassword"
                                   class="form-label">

                                Confirmer le mot de passe

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa fa-lock"></i>

                                </span>

                                <input type="password"
                                       id="confirmPassword"
                                       th:field="*{confirmPassword}"
                                       class="form-control"
                                       placeholder="Confirmez votre mot de passe"
                                       required>

                            </div>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}">
                            </div>

                        </div>
                        <!-- Submit -->

                        <div class="d-grid mt-4">

                            <button type="submit"
                                    class="btn btn-primary">
                                <i class="fa fa-user-plus"></i>
                                Créer mon compte
                            </button>
                        </div>
                    </form>
                </div>
                <!-- FOOTER -->

                <div class="card-footer text-center">

                    <span>
                        Vous avez déjà un compte ?
                    </span>

                    <a th:href="@{/login}"
                       class="text-primary">
                        Se connecter
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>

</html>
